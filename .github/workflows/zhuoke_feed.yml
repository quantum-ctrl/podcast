name: Zhuoke Podcast Feed

on:
  push:
    branches: [ main ]
    paths:
      - 'audios/zhuoke/**'
  workflow_dispatch:

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y exiftool file
        
    - name: Generate Zhuoke podcast feed
      run: |
        #!/bin/bash
        set -e

        FEED_FILE="feed/kjck_podcast.xml"
        AUDIO_PATH="audios/zhuoke"
        FEED_TITLE="卓克-科技参考"
        AUTHOR="卓克"
        BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main"

        result=""

        rename_files(){
            cd "$AUDIO_PATH"
            echo "🔄 Starting rename process in $AUDIO_PATH"

            # Step 1: Rename all files containing ' - 得到APP'
            for file in *' - 得到APP'*; do
                if [ -f "$file" ]; then
                    newname=$(echo "$file" | sed 's/ - 得到APP//' | tr -d ' ')
                    mv "$file" "$newname"
                    echo "Renamed: $file -> $newname"
                    git add "$newname"
                    git rm --cached "$file" || true
                fi
            done

            # Step 2: Delete any remaining old files that still match the pattern
            for old in *' - 得到APP'*; do
                if [ -f "$old" ]; then
                    echo "Deleting old file: $old"
                    rm -f "$old"
                    git rm "$old" || true
                fi
            done

            cd ../..
        }

        make_entry() {
            local file="$1"
            local title=$(basename "$file" | sed 's/\.[^.]*$//')
            local fileduration=$(exiftool -S -Duration "$file" 2>/dev/null | sed 's/Duration: //' | sed 's/ (approx)//' || echo "00:00:00")
            local date=$(git log --follow --format=%aD --diff-filter=A -- "$file" | tail -1)
            if [ -z "$date" ]; then
                date=$(date '+%a, %d %b %Y %T %Z')
            fi
            local filesize=$(stat -c%s "$file")
            local mimetype=$(file -b --mime-type "$file")
            local fileurl="${BASE_URL}/${AUDIO_PATH}/${file}"

            result+="\n<item>"
            result+="\n\t<title>$title</title>"
            result+="\n\t<itunes:author>$AUTHOR</itunes:author>"
            result+="\n\t<pubDate>$date</pubDate>"
            result+="\n\t<enclosure url=\"$fileurl\" length=\"$filesize\" type=\"$mimetype\"/>"
            result+="\n\t<itunes:duration>$fileduration</itunes:duration>"
            result+="\n\t<guid isPermaLink=\"false\">zhuoke_$(echo -n \"$title\" | md5sum | cut -d' ' -f1)</guid>"
            result+="\n</item>"
        }

        write_header() {
            result+="<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
            result+="\n<rss xmlns:itunes=\"http://www.itunes.com/dtds/podcast-1.0.dtd\" xmlns:atom=\"http://www.w3.org/2005/Atom\" xmlns:podcast=\"https://podcastindex.org/namespace/1.0\" version=\"2.0\">"
            result+="\n<channel>"
            result+="\n<title>$FEED_TITLE</title>"
            result+="\n<itunes:author>$AUTHOR</itunes:author>"
            result+="\n<itunes:image href=\"https://piccdn3.umiwi.com/img/202011/03/202011032054372409251528.jpeg\" />"
            result+="\n<description>卓克科技参考播客 - 这是一个为您提供最新科技动态和深度解析的独立播客。涵盖人工智能、基础科学、前沿技术等多个领域，致力于传播科学思维和科技常感。</description>"
            result+="\n<language>zh-cn</language>"
            result+="\n<link>$BASE_URL</link>"
            result+="\n<atom:link href=\"$BASE_URL/$FEED_FILE\" rel=\"self\" type=\"application/rss+xml\" />"
            result+="\n<itunes:category text=\"Technology\"/>"
            result+="\n<itunes:explicit>no</itunes:explicit>"
            result+="\n<podcast:locked>no</podcast:locked>"
            result+="\n<podcast:guid>76722d3d-355b-513b-a9a3-52467144709d</podcast:guid>"
        }

        write_footer() {
            result+="\n</channel>"
            result+="\n</rss>"
        }

        generate_feed() {
            echo "🎧 Generating Zhuoke podcast feed..."
            echo "Audio path: $AUDIO_PATH"
            echo "Feed file: $FEED_FILE"

            write_header
            rename_files

            cd "$AUDIO_PATH"
            for file in *.*; do
                if [ -f "$file" ]; then
                    echo "Processing: $file"
                    make_entry "$file"
                fi
            done
            cd ../..

            write_footer

            mkdir -p "$(dirname "$FEED_FILE")"
            echo -e "$result" > "$FEED_FILE"
            echo "✅ Zhuoke feed generated successfully: $FEED_FILE"
        }

        generate_feed
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate Zhuoke podcast feed"
          git push
        fi
